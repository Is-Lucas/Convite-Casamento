<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#69765b">
    <title>Luisa & Gabriel · 10.04.2027</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --cream: #f5f1e7;
            --ink: #344538;
            --sage: #758168;
            --gold: #ba9b64;
            --rose: #d9b7aa;
            --paper: #fffdf7
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 80px
        }

        body {
            margin: 0;
            background: var(--cream);
            color: var(--ink);
            font: 14px/1.8 Montserrat, sans-serif
        }

        button,
        a,
        input,
        textarea,
        select {
            font: inherit
        }

        button,
        a {
            touch-action: manipulation
        }

        button,
        .button {
            cursor: pointer;
            border: 1px solid var(--sage);
            background: var(--ink);
            color: #fff;
            padding: 14px 24px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            letter-spacing: 1px;
            font-size: 11px;
            text-transform: uppercase;
            transition: .3s
        }

        button:hover,
        .button:hover {
            background: var(--sage);
            transform: translateY(-2px)
        }

        button:focus-visible,
        a:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 5px
        }

        .outline {
            background: transparent;
            color: var(--ink)
        }

        h1,
        h2,
        h3,
        .script {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 400;
            line-height: 1.05
        }

        h1 {
            font-size: clamp(68px, 10vw, 132px);
            margin: 24px 0
        }

        h2 {
            font-size: clamp(45px, 6vw, 76px);
            margin: 18px 0 30px
        }

        h3 {
            font-size: 32px
        }

        .eyebrow {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 4px
        }

        .script {
            font-style: italic
        }

        .intro {
            position: fixed;
            inset: 0;
            z-index: 30;
            background: radial-gradient(ellipse at 50% 40%, #faf7ef, #e4e8dc);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            overflow: hidden;
            transition: opacity 1s
        }

        .intro:before,
        .intro:after {
            content: '❧';
            position: absolute;
            font: 300px Georgia;
            color: #78866b24;
            transform: rotate(-35deg);
            left: -50px;
            bottom: -80px
        }

        .intro:after {
            left: auto;
            right: -50px;
            top: -80px;
            transform: rotate(145deg)
        }

        .intro .eyebrow {
            margin-bottom: 35px
        }

        .envelope {
            position: relative;
            width: min(82vw, 470px);
            height: 285px;
            perspective: 1200px;
            margin: 50px 0 35px;
            filter: drop-shadow(0 24px 30px #34453820)
        }

        .back {
            position: absolute;
            inset: 0;
            background: #dadcc9
        }

        .letter {
            position: absolute;
            inset: 14px 22px;
            background: var(--paper);
            text-align: center;
            padding: 32px 12px;
            transition: transform 1.3s .5s;
            z-index: 1;
            border: 1px solid #bcaa7e55
        }

        .letter p {
            margin: 8px
        }

        .guest {
            font-size: 38px
        }

        .pocket {
            position: absolute;
            inset: 0;
            z-index: 3;
            background: linear-gradient(32deg, #e2e3d4 49.6%, transparent 50%) left/51% 100% no-repeat, linear-gradient(-32deg, #e2e3d4 49.6%, transparent 50%) right/51% 100% no-repeat;
            pointer-events: none
        }

        .flap {
            position: absolute;
            inset: 0;
            z-index: 4;
            background: #c9ceba;
            clip-path: polygon(0 0, 100% 0, 50% 62%);
            transform-origin: top;
            transition: transform 1s, z-index 0s .5s
        }

        .seal {
            position: absolute;
            z-index: 5;
            top: 110px;
            left: calc(50% - 36px);
            border-radius: 48%;
            width: 72px;
            height: 72px;
            padding: 0;
            background: radial-gradient(circle at 35% 30%, #d6bd88, #a17b43);
            border: 5px double #d7bd86;
            box-shadow: 0 4px 9px #63503545;
            color: #fff4d6;
            font: italic 26px 'Cormorant Garamond';
            text-transform: none;
            letter-spacing: -3px
        }

        .opened .flap {
            transform: rotateX(180deg);
            z-index: 0
        }

        .opened .letter {
            transform: translateY(-120px)
        }

        .opened .seal {
            opacity: 0;
            pointer-events: none
        }

        .enter {
            visibility: hidden;
            opacity: 0;
            transition: opacity .8s
        }

        .opened~.enter {
            visibility: visible;
            opacity: 1
        }

        .hint {
            font-size: 11px;
            letter-spacing: 2px;
            color: #68705c
        }

        .intro.fade {
            opacity: 0;
            pointer-events: none
        }

        .journey {
            position: fixed;
            inset: 0;
            z-index: 29;
            pointer-events: none;
            opacity: 0;
            overflow: hidden;
            background: #334536
        }

        .journey img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .journey.active {
            animation: journey 2.4s forwards
        }

        .journey.active img {
            animation: walk 2.4s forwards
        }

        @keyframes walk {
            to {
                transform: scale(1.5)
            }
        }

        @keyframes journey {

            0%,
            65% {
                opacity: 1
            }

            100% {
                opacity: 0
            }
        }

        nav {
            position: absolute;
            z-index: 4;
            top: 0;
            width: 100%;
            padding: 24px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            border-bottom: 1px solid #ffffff30
        }

        nav a {
            color: inherit;
            text-decoration: none;
            font-size: 10px;
            letter-spacing: 2px
        }

        nav .monogram {
            font: italic 30px 'Cormorant Garamond'
        }

        nav div {
            display: flex;
            gap: 30px
        }

        .hero {
            min-height: 100svh;
            position: relative;
            color: white;
            display: grid;
            place-items: center;
            text-align: center;
            overflow: hidden
        }

        .hero>img {
            position: absolute;
            width: 100%;
            height: 115%;
            object-fit: cover;
            top: -5%;
            filter: brightness(.51)
        }

        .hero-content {
            position: relative;
            padding: 125px 24px 75px
        }

        .hero .date {
            letter-spacing: 5px;
            font-size: 12px
        }

        .hero .script.welcome {
            font-size: 28px;
            margin: 26px 0
        }

        .hero .button {
            background: #f8f5ea;
            color: #344538;
            border: 0
        }

        .hero small {
            display: block;
            letter-spacing: 2px;
            margin-top: 35px;
            font-size: 9px
        }

        .countdown {
            display: flex;
            gap: 28px;
            justify-content: center;
            margin: 30px 0 35px
        }

        .countdown b {
            display: block;
            font: 38px 'Cormorant Garamond'
        }

        .countdown span {
            font-size: 8px;
            letter-spacing: 2px;
            text-transform: uppercase
        }

        .scrollcue {
            margin-top: 40px;
            font-size: 22px
        }

        .lights {
            position: absolute;
            top: 75px;
            left: 0;
            width: 100%;
            height: 70px;
            border-radius: 0 0 50% 50%;
            border-bottom: 1px solid #e8d0a377;
            display: flex;
            justify-content: space-around;
            pointer-events: none
        }

        .lights i {
            width: 5px;
            height: 8px;
            border-radius: 50%;
            background: #ffe5ab;
            box-shadow: 0 0 14px 5px #ffe5ab70;
            align-self: end;
            animation: twinkle 3s infinite alternate
        }

        .lights i:nth-child(2n) {
            animation-delay: 1s
        }

        .firefly {
            position: fixed;
            width: 3px;
            height: 3px;
            background: #e1cd8c;
            border-radius: 50%;
            box-shadow: 0 0 8px #e1cd8c;
            pointer-events: none;
            z-index: 5;
            animation: float 9s infinite alternate
        }

        @keyframes twinkle {
            to {
                opacity: .35
            }
        }

        @keyframes float {
            to {
                transform: translate(30px, -100px);
                opacity: .1
            }
        }

        section {
            padding: 110px max(6vw, 24px)
        }

        .section-head {
            text-align: center;
            max-width: 650px;
            margin: 0 auto 50px
        }

        .section-head p {
            max-width: 490px;
            margin: 0 auto
        }

        .split {
            display: grid;
            grid-template-columns: 1.08fr 1fr;
            gap: 8%;
            align-items: center;
            max-width: 1200px;
            margin: auto
        }

        .photo-frame {
            position: relative;
            padding: 15px;
            border: 1px solid #b6aa8b70
        }

        .photo-frame img {
            width: 100%;
            height: 540px;
            object-fit: cover;
            display: block
        }

        .photo-frame:after {
            content: 'O CENÁRIO DO NOSSO SIM';
            position: absolute;
            bottom: 35px;
            left: 35px;
            color: #fff;
            font-size: 9px;
            letter-spacing: 3px
        }

        .venue p {
            max-width: 430px
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 28px
        }

        .gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
            max-width: 1200px;
            margin: 40px auto 0
        }

        .gallery button {
            padding: 0;
            border: 0;
            background: none;
            overflow: hidden
        }

        .gallery img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            transition: transform 1s
        }

        .gallery button:hover img {
            transform: scale(1.04)
        }

        .caption {
            font: italic 22px 'Cormorant Garamond';
            text-align: center;
            margin-top: 25px
        }

        .story {
            background: #e6e9de;
            text-align: center
        }

        .story .story-body {
            max-width: 620px;
            margin: auto;
            font-size: 15px;
            line-height: 2.1;
            white-space: pre-line
        }

        .ornament {
            color: var(--gold);
            font: 42px Georgia
        }

        .dress {
            background: var(--paper)
        }

        .dress-grid {
            max-width: 1000px;
            margin: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 90px
        }

        .palette {
            display: flex;
            gap: 14px;
            margin: 25px 0
        }

        .swatch {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 1px solid #0002
        }

        .note {
            font-size: 11px;
            opacity: .75
        }

        .gifts {
            background: var(--cream)
        }

        .gift-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
            max-width: 1100px;
            margin: auto
        }

        .gift {
            background: var(--paper);
            border: 1px solid #b6aa8b55;
            text-align: center;
            padding: 35px 25px
        }

        .gift .emoji {
            font-size: 42px;
            height: 80px
        }

        .gift img {
            width: 100%;
            height: 140px;
            object-fit: cover
        }

        .gift h3 {
            font-size: 27px;
            margin: 10px 0
        }

        .gift .price {
            font-size: 12px;
            letter-spacing: 2px;
            margin: 20px
        }

        .gift button {
            width: 100%;
            background: transparent;
            color: var(--ink)
        }

        .rsvp {
            background: var(--ink);
            color: var(--cream);
            text-align: center
        }

        .rsvp .section-head {
            margin-bottom: 30px
        }

        .rsvp .script {
            font-size: 30px
        }

        .rsvp .actions {
            justify-content: center
        }

        .rsvp button {
            border-color: #c5c8b4
        }

        .rsvp button:first-child {
            background: var(--cream);
            color: var(--ink)
        }

        .rsvp input {
            background: transparent;
            border: 0;
            border-bottom: 1px solid #ffffff55;
            color: inherit;
            padding: 12px;
            width: 280px;
            text-align: center;
            margin: 15px
        }

        .rsvp .outline {
            color: var(--cream)
        }

        footer {
            text-align: center;
            padding: 55px 20px
        }

        footer .script {
            font-size: 35px
        }

        footer a {
            color: inherit;
            font-size: 10px
        }

        .music {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 12;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            padding: 0;
            background: var(--paper);
            color: var(--ink);
            font-size: 19px;
            box-shadow: 0 4px 20px #0002
        }

        .reveal {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 1s, transform 1s
        }

        .reveal.visible {
            opacity: 1;
            transform: none
        }

        dialog {
            border: 1px solid var(--gold);
            padding: 35px;
            max-width: min(92vw, 580px);
            background: var(--paper);
            color: var(--ink)
        }

        dialog::backdrop {
            background: #1b2a22b8;
            backdrop-filter: blur(5px)
        }

        dialog h2 {
            font-size: 42px
        }

        dialog img {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain
        }

        .close {
            float: right;
            padding: 6px 13px
        }

        .admin {
            max-width: 1000px;
            margin: auto;
            padding: 110px 24px
        }

        .admin label {
            display: block;
            margin: 14px 0;
            font-size: 12px
        }

        .admin input,
        .admin textarea {
            display: block;
            width: 100%;
            padding: 12px;
            border: 1px solid #abb09d;
            background: var(--paper);
            color: var(--ink)
        }

        .admin textarea {
            min-height: 110px
        }

        .admin details {
            border-bottom: 1px solid #aaa6;
            padding: 20px 0
        }

        .admin summary {
            cursor: pointer;
            font: 32px 'Cormorant Garamond'
        }

        .admin .row {
            padding: 15px 0;
            border-bottom: 1px solid #aaa4;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap
        }

        .admin .row span {
            flex: 1
        }

        .admin button {
            padding: 10px 14px
        }

        .admin .preview-img {
            width: 100px;
            height: 70px;
            object-fit: cover
        }

        .savebar {
            position: sticky;
            bottom: 0;
            background: var(--cream);
            padding: 20px 0
        }

        .status {
            min-height: 24px
        }

        body.locked {
            overflow: hidden
        }

        @media(max-width:700px) {
            nav div a {
                display: none
            }

            nav div a:last-child {
                display: block
            }

            nav {
                padding: 20px 24px
            }

            .hero-content {
                padding-top: 145px
            }

            .hero h1 {
                font-size: 76px
            }

            .hero h1 span {
                display: block
            }

            .hero .date {
                font-size: 10px;
                letter-spacing: 3px
            }

            .countdown {
                gap: 22px
            }

            section {
                padding: 75px 24px
            }

            .split,
            .dress-grid {
                grid-template-columns: 1fr;
                gap: 35px
            }

            .photo-frame img {
                height: 360px
            }

            .venue .split>div:last-child {
                text-align: center
            }

            .actions {
                justify-content: center
            }

            .gallery {
                gap: 12px
            }

            .gallery img {
                height: 200px
            }

            .gift-grid {
                grid-template-columns: 1fr
            }

            .gift {
                display: grid;
                grid-template-columns: 70px 1fr;
                align-items: center;
                padding: 22px;
                text-align: left
            }

            .gift .emoji {
                grid-row: span 2;
                height: auto
            }

            .gift h3 {
                margin: 0
            }

            .gift .price {
                margin: 8px 0
            }

            .gift button {
                grid-column: 1/-1;
                margin-top: 16px
            }

            .dress-grid {
                gap: 15px
            }

            .envelope {
                height: 240px
            }

            .seal {
                top: 85px
            }

            .letter {
                padding-top: 20px
            }

            .guest {
                font-size: 32px
            }

            .intro .eyebrow {
                font-size: 9px;
                letter-spacing: 3px
            }

            .intro .script {
                font-size: 40px
            }

            .gallery button {
                min-height: 160px
            }
        }

        @media(prefers-color-scheme:dark) {
            :root {
                --cream: #232e27;
                --paper: #2b382e;
                --ink: #e4e6d9;
                --sage: #9eac90
            }

            .intro {
                background: radial-gradient(ellipse, #344538, #1f2c24)
            }

            .intro .hint {
                color: #c3ccb8
            }

            .letter {
                color: #344538;
                background: #fffdf7
            }

            .story {
                background: #2e3b30
            }

            .rsvp {
                background: #17251d
            }

            .rsvp button:first-child {
                color: #e4e6d9
            }

            .hero .button {
                color: #344538
            }

            .photo-frame {
                border-color: #c2af8155
            }
        }

        @media(prefers-reduced-motion:reduce) {

            *,
            *:before,
            *:after {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important
            }

            .reveal {
                opacity: 1;
                transform: none
            }

            .journey {
                display: none
            }
        }
    </style>

services:
  - type: web
    name: convite-luisa-gabriel
    runtime: node
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: APP_URL
        sync: false
      - key: SETUP_KEY
        generateValue: true
    disk:
      name: wedding-data
      mountPath: /var/data
      sizeGB: 1
